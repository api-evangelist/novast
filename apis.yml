name: Novast Laboratories
description: >-
  Novast Laboratories is a pharmaceutical development and manufacturing company
  (CDMO) headquartered in Nantong, Jiangsu Province, China, founded in 2005 by
  Dr. Guohua Zhang and a multinational management team. Novast specializes in
  high-barrier, difficult-to-formulate generic and specialty pharmaceuticals,
  including ultra-low-dose hormonal and extended- / modified-release oral
  products built on proprietary drug-delivery technologies. It is noted as one
  of the first China-based pharmaceutical companies to gain U.S. FDA approval
  for finished drug products marketed in the United States, and provides
  contract development and manufacturing services to generic and innovator
  companies. Surfaced as a portfolio company of Qiming Venture Partners and
  added to the API Evangelist network. Novast is a physical pharmaceutical
  manufacturer and publishes no public developer API, OpenAPI specification, SDK,
  or developer documentation surface.
